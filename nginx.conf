# ============================================
# Nexious API — Nginx Site Config
# 放置到 /etc/nginx/sites-available/nexious-api
# 启用: sudo ln -s /etc/nginx/sites-available/nexious-api /etc/nginx/sites-enabled/
# 验证: sudo nginx -t
# 重载: sudo systemctl reload nginx
# ============================================

# HTTP → 先跑通 HTTP，之后再运行 certbot 获取 SSL 证书
server {
    listen 80;
    server_name nexious-api.com www.nexious-api.com;

    # 上传限制
    client_max_body_size 10M;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # ===================== 前端静态文件 =====================
    root /opt/nexious-api/frontend/dist;
    index index.html;

    # 静态资源强缓存（文件名带 hash，放心缓存）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # favicon
    location = /favicon.svg {
        expires 7d;
        add_header Cache-Control "public";
    }

    # SPA fallback — 所有非文件请求回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ===================== API 反向代理 =====================
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # 传递真实客户端信息
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket (保留给后续 websocket 功能)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 超时
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # 不缓存 API 响应
        add_header Cache-Control "no-store";
    }

    # ===================== 安全头部 =====================
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
